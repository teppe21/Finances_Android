<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>Finances app icon: a rising trend line</title>
  <!-- Background: the app's near-black -->
  <rect width="108" height="108" fill="#0B0D10"/>
  <!-- Baseline in the hairline grey; everything sits inside the 72x72 safe zone (18..90) -->
  <path d="M32 76 H76" fill="none" stroke="#282D34" stroke-width="4" stroke-linecap="round"/>
  <!-- The one accent: a rising balance line ending in a dot -->
  <path d="M32 64 L46 50 L56 58 L74 38" fill="none" stroke="#4A8FFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="74" cy="38" r="5" fill="#F2F4F7"/>
</svg>
