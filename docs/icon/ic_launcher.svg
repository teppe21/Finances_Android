<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>Finances app icon: a receipt</title>
  <!-- Background -->
  <rect width="108" height="108" fill="#FAF7F2"/>
  <!-- Receipt outline with a torn lower edge; everything sits inside the 72x72 safe zone (18..90) -->
  <path d="M36 26 H72 V82 L66 76 L60 82 L54 76 L48 82 L42 76 L36 82 Z"
        fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Two item lines -->
  <path d="M43 38 H65 M43 47 H57" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
  <!-- The one terracotta detail: the total -->
  <path d="M43 61 H65" fill="none" stroke="#C15F3C" stroke-width="4" stroke-linecap="round"/>
</svg>
