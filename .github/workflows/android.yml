name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew || { echo "gradlew is not executable (check git mode 100755)" >&2; exit 1; }
          java -version
          ./gradlew --no-daemon --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew --no-daemon lint --stacktrace

      - name: Show lint problems
        if: failure()
        run: |
          f=$(ls app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt 2>/dev/null | head -1)
          [ -n "$f" ] && grep -E "Error:|Warning:" -B1 "$f" | grep -E "^app/|Error:" | head -150 || echo "no lint text report found"

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # The instrumented tests (Room DAOs, migrations, Compose UI) need an emulator or device, which this
      # job does not have. They are at least compiled here so they cannot rot; run them locally with
      # ./gradlew connectedDebugAndroidTest.
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest --stacktrace

      # Room exports the schema on every build. If the committed schema files do not match the entities,
      # the build above just rewrote or added one: fail so the change is committed with the migration.
      - name: Check exported Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            git diff -- app/schemas | head -80
            echo "Room schema files are out of date. Commit the files under app/schemas." >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: finances-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release-build:
    # Catches R8, release-lint and packaging problems before a real release is tagged.
    # Signs with a throwaway key generated on this runner; the key and its password are never stored
    # or uploaded, and the resulting APK is not a release.
    name: Release build check (R8, throwaway key)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create throwaway signing key
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI throwaway" \
            -storepass "$pw" -keypass "$pw" >/dev/null 2>&1
          {
            echo "FINANCES_KEYSTORE_PATH=$RUNNER_TEMP/throwaway.jks"
            echo "FINANCES_KEYSTORE_PASSWORD=$pw"
            echo "FINANCES_KEY_ALIAS=throwaway"
            echo "FINANCES_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"

      - name: Run release unit tests, release lint, assemble release APK and bundle
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease --stacktrace

      - name: Verify signature and 16 KB alignment
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/release/
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1 || { cat "$RUNNER_TEMP/sig.txt"; exit 1; }
          grep -E "Verifies|Signer #1 certificate (DN|SHA-256)" "$RUNNER_TEMP/sig.txt"
          ./scripts/check-16kb-alignment.sh "$apk"

      - name: Remove throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/throwaway.jks"
