name: Android release build

# Push a tag like v2.1.0 to build a signed release APK and publish it as a GitHub Release.
# Tags with a hyphen (v2.1.0-beta.1) are pre-release tags for hand-published debug beta APKs: they do not
# run this workflow, which needs the signing secrets and a tag equal to v<versionName>.
# "Run workflow" (workflow_dispatch) builds and uploads artifacts only; it does not publish a Release.
on:
  push:
    tags: [ "v*", "!v*-*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed AAB and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # needed only to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version} in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FINANCES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FINANCES_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle and APK
        env:
          FINANCES_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          FINANCES_KEYSTORE_PASSWORD: ${{ secrets.FINANCES_KEYSTORE_PASSWORD }}
          FINANCES_KEY_ALIAS: ${{ secrets.FINANCES_KEY_ALIAS }}
          FINANCES_KEY_PASSWORD: ${{ secrets.FINANCES_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease assembleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Verify APK signature
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/release/
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1 || { cat "$RUNNER_TEMP/sig.txt"; exit 1; }
          grep -E "Verifies|Signer #1 certificate (DN|SHA-256)" "$RUNNER_TEMP/sig.txt"

      - name: Check 16 KB alignment of native libraries
        run: ./scripts/check-16kb-alignment.sh app/build/outputs/apk/release/app-release.apk

      - name: Name the release files
        run: |
          name="Finances-${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "${name}.apk"
          sha256sum "${name}.apk" > "${name}.apk.sha256"
          echo "RELEASE_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ env.RELEASE_NAME }}.apk
            ${{ env.RELEASE_NAME }}.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_NAME}.apk" "${RELEASE_NAME}.apk.sha256" \
            --title "Finances ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
